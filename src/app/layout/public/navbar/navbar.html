<header class="navbar">

  <div class="navbar__container">

    <!-- =====================================================
     LOGO / BRAND
====================================================== -->
    <a routerLink="/" class="navbar__brand" aria-label="MYM Car Rental Home" (click)="closeMobileMenu()">
      <span class="navbar__brand-mark">
        <img src="assets/images/logo/mym-logo.png" alt="" aria-hidden="true" />
      </span>

      <span class="navbar__brand-divider" aria-hidden="true"></span>

      <span class="navbar__brand-wordmark">
        <img src="assets/images/logo/mym-car-rental-logo.svg" alt="MYM Car Rental" />
      </span>
    </a>

    <!-- =====================================================
         DESKTOP NAVIGATION
    ====================================================== -->
    <nav class="navbar__nav" aria-label="Main navigation">

      <a routerLink="/" routerLinkActive="navbar__link--active" [routerLinkActiveOptions]="{ exact: true }"
        class="navbar__link">
        <span> {{ 'NAVBAR.HOME' | translate }}</span>
      </a>

      <a routerLink="/cars" routerLinkActive="navbar__link--active" class="navbar__link">
        <span>Cars</span>
      </a>

      <a routerLink="/services" routerLinkActive="navbar__link--active" class="navbar__link">
        <span>Services</span>
      </a>

      <a routerLink="/about-us" routerLinkActive="navbar__link--active" class="navbar__link">
        <span>About</span>
      </a>

      <a routerLink="/faq" routerLinkActive="navbar__link--active" class="navbar__link">
        <span>FAQ</span>
      </a>

      <a routerLink="/contact" routerLinkActive="navbar__link--active" class="navbar__link">
        <span>Contact</span>
      </a>

    </nav>


    <!-- =====================================================
         ACTIONS
    ====================================================== -->
    <div class="navbar__actions">

      <button type="button" class="language-switcher" (click)="toggleLanguage()">
        {{ languageService.isArabic() ? 'English' : 'العربية' }}
      </button>
      <!-- WhatsApp -->
      <a href="https://wa.me/971XXXXXXXXX" target="_blank" rel="noopener noreferrer" class="navbar__whatsapp"
        aria-label="Contact MYM on WhatsApp">
        <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
      </a>
      <!-- Authentication -->
      @if (authService.isLoggedIn()) {

      <button type="button" class="navbar__login btn btn-outline" (click)="logout()"
        aria-label="Logout from MYM Car Rental">

        <i class="fa-solid fa-right-from-bracket" aria-hidden="true">
        </i>

        <span>Logout</span>
      </button>

      } @else {

      <a routerLink="/login" class="navbar__login btn btn-outline" aria-label="Login to MYM Car Rental">

        <i class="fa-solid fa-user" aria-hidden="true">
        </i>

        <span>Login</span>
      </a>

      }
      <!-- Booking CTA -->
      <a routerLink="/cars" class="navbar__cta" (click)="closeMobileMenu()">
        <span>Book a Car</span>

        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </a>


      <!-- Mobile Menu Toggle -->
      <button type="button" class="navbar__menu-toggle" [class.navbar__menu-toggle--active]="isMobileMenuOpen"
        [attr.aria-expanded]="isMobileMenuOpen" aria-controls="mobile-navigation" aria-label="Toggle navigation menu"
        (click)="toggleMobileMenu()">
        <i class="fa-solid" [class.fa-bars]="!isMobileMenuOpen" [class.fa-xmark]="isMobileMenuOpen"
          aria-hidden="true"></i>
      </button>

    </div>

  </div>


  <!-- =====================================================
       MOBILE NAVIGATION
  ====================================================== -->
  <div id="mobile-navigation" class="navbar__mobile" [class.navbar__mobile--open]="isMobileMenuOpen">

    <div class="navbar__mobile-inner">

      <nav class="navbar__mobile-nav" aria-label="Mobile navigation">

        <!-- Home -->
        <a routerLink="/" routerLinkActive="navbar__mobile-link--active" [routerLinkActiveOptions]="{ exact: true }"
          class="navbar__mobile-link" (click)="closeMobileMenu()">
          <span class="navbar__mobile-icon">
            <i class="fa-solid fa-house" aria-hidden="true"></i>
          </span>

          <span class="navbar__mobile-label">
            Home
          </span>

          <i class="fa-solid fa-arrow-right navbar__mobile-arrow" aria-hidden="true"></i>
        </a>


        <!-- Cars -->
        <a routerLink="/cars" routerLinkActive="navbar__mobile-link--active" class="navbar__mobile-link"
          (click)="closeMobileMenu()">
          <span class="navbar__mobile-icon">
            <i class="fa-solid fa-car" aria-hidden="true"></i>
          </span>

          <span class="navbar__mobile-label">
            Cars
          </span>

          <i class="fa-solid fa-arrow-right navbar__mobile-arrow" aria-hidden="true"></i>
        </a>


        <!-- Services -->
        <a routerLink="/services" routerLinkActive="navbar__mobile-link--active" class="navbar__mobile-link"
          (click)="closeMobileMenu()">
          <span class="navbar__mobile-icon">
            <i class="fa-solid fa-star" aria-hidden="true"></i>
          </span>

          <span class="navbar__mobile-label">
            Services
          </span>

          <i class="fa-solid fa-arrow-right navbar__mobile-arrow" aria-hidden="true"></i>
        </a>


        <!-- About -->
        <a routerLink="/about-us" routerLinkActive="navbar__mobile-link--active" class="navbar__mobile-link"
          (click)="closeMobileMenu()">
          <span class="navbar__mobile-icon">
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
          </span>

          <span class="navbar__mobile-label">
            About
          </span>

          <i class="fa-solid fa-arrow-right navbar__mobile-arrow" aria-hidden="true"></i>
        </a>


        <!-- FAQ -->
        <a routerLink="/faq" routerLinkActive="navbar__mobile-link--active" class="navbar__mobile-link"
          (click)="closeMobileMenu()">
          <span class="navbar__mobile-icon">
            <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
          </span>

          <span class="navbar__mobile-label">
            FAQ
          </span>

          <i class="fa-solid fa-arrow-right navbar__mobile-arrow" aria-hidden="true"></i>
        </a>


        <!-- Contact -->
        <a routerLink="/contact" routerLinkActive="navbar__mobile-link--active" class="navbar__mobile-link"
          (click)="closeMobileMenu()">
          <span class="navbar__mobile-icon">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
          </span>

          <span class="navbar__mobile-label">
            Contact
          </span>

          <i class="fa-solid fa-arrow-right navbar__mobile-arrow" aria-hidden="true"></i>
        </a>

      </nav>


      <!-- =====================================================
           MOBILE ACTIONS
      ====================================================== -->
      <div class="navbar__mobile-actions">

        <a routerLink="/cars" class="btn btn-primary" (click)="closeMobileMenu()">

          <span>Book a Car</span>

          <i class="fa-solid fa-arrow-right" aria-hidden="true">
          </i>

        </a>

        <a href="https://wa.me/971XXXXXXXXX" target="_blank" rel="noopener noreferrer" class="navbar__mobile-whatsapp">

          <i class="fa-brands fa-whatsapp" aria-hidden="true">
          </i>

          <span>WhatsApp</span>

        </a>

        <!-- Authentication -->
        @if (authService.isLoggedIn()) {

        <button type="button" class="navbar__mobile-auth btn btn-outline" (click)="logout()">

          <i class="fa-solid fa-right-from-bracket" aria-hidden="true">
          </i>

          <span>Logout</span>

        </button>

        } @else {

        <a routerLink="/login" class="navbar__mobile-auth btn btn-outline" (click)="closeMobileMenu()">

          <i class="fa-solid fa-user" aria-hidden="true">
          </i>

          <span>Login</span>

        </a>

        }

      </div>

    </div>

  </div>

</header>
