@if (pageLoading()) {

<div class="loading-state">
  Loading...
</div>

} @else {

<div class="category-form-page">

  <div class="page-header">

    <h1>Edit Category</h1>

    <button
      class="btn-outline"
      type="button"
      (click)="cancel()">

      Back

    </button>

  </div>

  <form
    class="category-form"
    [formGroup]="form"
    (ngSubmit)="submit()">

    <div class="form-grid">

      <div class="form-group">
        <label class="form-label">
          Arabic Name
        </label>

        <input
          class="form-control"
          formControlName="nameAr">
      </div>

      <div class="form-group">
        <label class="form-label">
          English Name
        </label>

        <input
          class="form-control"
          formControlName="nameEn">
      </div>

      <div class="form-group">
        <label class="form-label">
          Slug
        </label>

        <input
          class="form-control"
          formControlName="slug">
      </div>

    </div>

    <div class="form-group">

      <label class="form-label">
        Arabic Description
      </label>

      <textarea
        class="form-control"
        formControlName="descriptionAr">
      </textarea>

    </div>

    <div class="form-group">

      <label class="form-label">
        English Description
      </label>

      <textarea
        class="form-control"
        formControlName="descriptionEn">
      </textarea>

    </div>

    <div class="form-group">

      <label class="form-label">
        Replace Image
      </label>

      <input
        type="file"
        accept="image/*"
        (change)="onImageSelected($event)">

    </div>

    @if (imagePreview()) {

      <div class="preview-card">

        <img
          [src]="imagePreview()!"
          alt="Category">

      </div>

    }

    <div class="actions">

      <button
        class="btn-outline"
        type="button"
        (click)="cancel()">

        Cancel

      </button>

      <button
        class="btn-primary"
        type="submit"
        [disabled]="loading()">

        Update Category

      </button>

    </div>

  </form>

</div>

}
