<div class="page-header">

  <div class="page-header__content">

    <h1>{{ title }}</h1>

    @if (description) {

      <p>
        {{ description }}
      </p>

    }

  </div>

  @if (actionLabel) {

    <button
      class="btn-primary"
      (click)="actionClick.emit()">

      {{ actionLabel }}

    </button>

  }

</div>
