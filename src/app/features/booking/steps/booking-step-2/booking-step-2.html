<section class="booking-step">

  <div class="booking-step__container">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="booking-step__header">

      <span class="booking-step__eyebrow">
        Step 2 of 4
      </span>

      <h1 class="booking-step__title">
        Your Information
      </h1>

      <p class="booking-step__description">
        Enter your information to continue with your booking.
      </p>

    </header>


    <!-- =========================
         CUSTOMER FORM
    ========================== -->
    <div class="booking-step__form">


      <!-- Full Name -->
      <div class="form-group form-group--full">

        <label for="customerFullName">
          Full Name
        </label>

        <div class="input-wrapper">

          <i class="fa-regular fa-user"></i>

          <input
            id="customerFullName"
            type="text"
            placeholder="Enter your full name"
            autocomplete="name"
            [value]="booking.customerFullName"
            (input)="onTextChange('customerFullName', $event)"
          />

        </div>

      </div>


      <!-- Email -->
      <div class="form-group">

        <label for="customerEmail">
          Email Address
        </label>

        <div class="input-wrapper">

          <i class="fa-regular fa-envelope"></i>

          <input
            id="customerEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            [value]="booking.customerEmail"
            (input)="onTextChange('customerEmail', $event)"
          />

        </div>

      </div>


      <!-- Phone -->
      <div class="form-group">

        <label for="customerPhone">
          Phone Number
        </label>

        <div class="input-wrapper">

          <i class="fa-solid fa-phone"></i>

          <input
            id="customerPhone"
            type="tel"
            placeholder="+971 50 000 0000"
            autocomplete="tel"
            [value]="booking.customerPhone"
            (input)="onTextChange('customerPhone', $event)"
          />

        </div>

      </div>


      <!-- Driving License -->
      <div class="form-group form-group--full">

        <label for="drivingLicense">
          Driving License Number
        </label>

        <div class="input-wrapper">

          <i class="fa-regular fa-id-card"></i>

          <input
            id="drivingLicense"
            type="text"
            placeholder="Enter your driving license number"
            [value]="booking.drivingLicense"
            (input)="onTextChange('drivingLicense', $event)"
          />

        </div>

      </div>


      <!-- Notes -->
      <div class="form-group form-group--full">

        <label for="notes">
          Additional Notes
          <span>(Optional)</span>
        </label>

        <textarea
          id="notes"
          rows="4"
          placeholder="Any additional information..."
          [value]="booking.notes"
          (input)="onTextChange('notes', $event)"
        ></textarea>

      </div>

    </div>


    <!-- =========================
         INSURANCE
    ========================== -->
    <div class="booking-step__insurance">

      <div class="insurance-info">

        <div class="insurance-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div>

          <h3>
            Rental Insurance
          </h3>

          <p>
            Add extra protection to your rental.
          </p>

        </div>

      </div>


      <label class="insurance-toggle">

        <input
          type="checkbox"
          [checked]="booking.includeInsurance"
          (change)="onInsuranceChange($event)"
        />

        <span class="insurance-toggle__slider"></span>

      </label>

    </div>


    <!-- =========================
         INSURANCE PRICE
    ========================== -->
    @if (booking.includeInsurance) {

      <div class="booking-step__insurance-price">

        <span>
          Insurance
        </span>

        <strong>
          AED {{ insurancePrice | number:'1.0-2' }}
        </strong>

      </div>

    }


    <!-- =========================
         ACTIONS
    ========================== -->
    <div class="booking-step__actions">

      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="previous()"
      >

        <i class="fa-solid fa-arrow-left"></i>

        Back

      </button>


      <button
        type="button"
        class="btn btn-primary"
        [disabled]="!isValid"
        (click)="continue()"
      >

        Continue

        <i class="fa-solid fa-arrow-right"></i>

      </button>

    </div>

  </div>

</section>
