<section class="login-page">

  <div class="login-page__container">

    
    <div class="login-page__brand">
      <span class="login-page__logo">MYM</span>
    </div>

    <div class="login-page__content">

      <div class="login-page__header">
        <h1>
          {{ 'LOGIN.HEADER.TITLE' | translate }}
        </h1>
        <p>
          {{ 'LOGIN.HEADER.DESCRIPTION' | translate }}
        </p>
      </div>

      <div class="login-page__divider">
        <span>
          {{ 'LOGIN.DIVIDER' | translate }}
        </span>
      </div>

      <div #googleButton class="login-page__google-button">
      </div>

      <p class="login-page__footer-note">
        {{ 'LOGIN.FOOTER.BY_CONTINUING' | translate }}
        <a href="#">
          {{ 'LOGIN.FOOTER.TERMS' | translate }}
        </a>
        &amp;
        <a href="#">
          {{ 'LOGIN.FOOTER.PRIVACY_POLICY' | translate }}
        </a>
      </p>

    </div>
    

  </div>

</section>
