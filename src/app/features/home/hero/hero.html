<section class="hero">

  <!-- =====================================================
       HERO BACKGROUND
  ====================================================== -->

  <div class="hero__bg" aria-hidden="true">

    <img
      class="hero__bg-img"
      src="assets/images/hero/hero.png"
      alt=""
      width="1920"
      height="1080"
      fetchpriority="high"
      loading="eager"
    />

    <div class="hero__overlay"></div>

  </div>


  <!-- =====================================================
       HERO CONTAINER
  ====================================================== -->

  <div class="hero__container">


    <!-- ===================================================
         HERO CONTENT
    ==================================================== -->

    <div class="hero__content">

      <span class="hero__eyebrow">
        Premium Car Rental
      </span>


      <h1 class="hero__title">
        Luxury
        
        <span>on your terms</span>
      </h1>


      <p class="hero__subtitle">
        Premium Cars. Flexible Rentals. Exceptional Experience.
      </p>


      <!-- =================================================
           RENTAL PLANS
      ================================================== -->

      <fieldset class="hero__plans">

        <legend class="visually-hidden">
          Rental plan
        </legend>


        <!-- DAILY -->

        <label
          class="hero__plan"
          [class.hero__plan--active]="selectedPlan() === 'daily'"
        >

          <input
            type="radio"
            name="rentalPlan"
            value="daily"
            [checked]="selectedPlan() === 'daily'"
            (change)="selectPlan('daily')"
          />

          <span
            class="hero__plan-icon"
            aria-hidden="true"
          >
            <i class="fa-regular fa-clock"></i>
          </span>

          <span class="hero__plan-content">
            <span class="hero__plan-label">
              Daily
            </span>

          </span>

        </label>


        <!-- WEEKLY -->

        <label
          class="hero__plan"
          [class.hero__plan--active]="selectedPlan() === 'weekly'"
        >

          <input
            type="radio"
            name="rentalPlan"
            value="weekly"
            [checked]="selectedPlan() === 'weekly'"
            (change)="selectPlan('weekly')"
          />

          <span
            class="hero__plan-icon"
            aria-hidden="true"
          >
            <i class="fa-regular fa-calendar-days"></i>
          </span>

          <span class="hero__plan-content">
            <span class="hero__plan-label">
              Weekly
            </span>

          </span>

        </label>


        <!-- MONTHLY -->

        <label
          class="hero__plan"
          [class.hero__plan--active]="selectedPlan() === 'monthly'"
        >

          <input
            type="radio"
            name="rentalPlan"
            value="monthly"
            [checked]="selectedPlan() === 'monthly'"
            (change)="selectPlan('monthly')"
          />

          <span
            class="hero__plan-icon"
            aria-hidden="true"
          >
            <i class="fa-regular fa-calendar-check"></i>
          </span>

          <span class="hero__plan-content">
            <span class="hero__plan-label">
              Monthly
            </span>

            
          </span>

        </label>

      </fieldset>


      <!-- =================================================
           CTA
      ================================================== -->

      <a
        routerLink="/cars"
        class="btn btn-primary hero__cta"
      >
        <span>
          Explore Cars
        </span>

        <i
          class="fa-solid fa-arrow-right"
          aria-hidden="true"
        ></i>
      </a>

    </div>


    <!-- ===================================================
         SEARCH CARD
    ==================================================== -->

    <form
      class="hero__search glass-card"
      (submit)="onSearchSubmit($event)"
    >

      <!-- PICKUP LOCATION -->

      <div class="hero__search-field">

        <label for="pickupLocation">
          <i
            class="fa-solid fa-location-dot"
            aria-hidden="true"
          ></i>

          Pick-up Location
        </label>


        <select
          id="pickupLocation"
          name="pickupLocation"
          class="form-control"
        >

          <option value="dubai">
            Dubai
          </option>

          <option value="abu-dhabi">
            Abu Dhabi
          </option>

          <option value="sharjah">
            Sharjah
          </option>

          <option value="ras-al-khaimah">
            Ras Al Khaimah
          </option>

        </select>

      </div>


      <!-- PICKUP DATE -->

      <div class="hero__search-field">

        <label for="pickupDate">

          <i
            class="fa-regular fa-calendar"
            aria-hidden="true"
          ></i>

          Pick-up Date

        </label>


        <input
          type="text"
          id="pickupDate"
          name="pickupDate"
          class="form-control"
          placeholder="Select Date"
        />

      </div>


      <!-- RETURN DATE -->

      <div class="hero__search-field">

        <label for="returnDate">

          <i
            class="fa-regular fa-calendar-check"
            aria-hidden="true"
          ></i>

          Return Date

        </label>


        <input
          type="text"
          id="returnDate"
          name="returnDate"
          class="form-control"
          placeholder="Select Date"
        />

      </div>


      <!-- CAR TYPE -->

      <div class="hero__search-field">

        <label for="carType">

          <i
            class="fa-solid fa-car"
            aria-hidden="true"
          ></i>

          Car Type

        </label>


        <select
          id="carType"
          name="carType"
          class="form-control"
        >

          <option value="all">
            All Types
          </option>

          <option value="suv">
            SUV
          </option>

          <option value="sedan">
            Sedan
          </option>

          <option value="sports">
            Sports
          </option>

          <option value="economy">
            Economy
          </option>

        </select>

      </div>


      <!-- SEARCH BUTTON -->

      <button
        type="submit"
        class="btn btn-primary hero__search-btn"
      >

        <i
          class="fa-solid fa-magnifying-glass"
          aria-hidden="true"
        ></i>

        <span>
          Search Cars
        </span>

      </button>

    </form>

  </div>

</section>
