<section class="hero">

  <!-- =====================================================
       HERO BACKGROUND
  ====================================================== -->
  <div
    class="hero__bg"
    aria-hidden="true"
  >
    <img
      class="hero__bg-img"
      src="assets/images/hero/hero.png"
      alt=""
      width="1920"
      height="1080"
      fetchpriority="high"
      loading="eager"
    />

    <div class="hero__overlay"></div>
  </div>


  <!-- =====================================================
       HERO CONTAINER
  ====================================================== -->
  <div class="hero__container">

    <!-- ===================================================
         HERO CONTENT
    ==================================================== -->
    <div class="hero__content">

      <!-- Eyebrow -->
      <span class="hero__eyebrow">
        {{ 'HERO.EYEBROW' | translate }}
      </span>


      <!-- Title -->
      <h1 class="hero__title">
        {{ 'HERO.TITLE' | translate }}
        <span>
          {{ 'HERO.TITLE_HIGHLIGHT' | translate }}
        </span>
      </h1>


      <!-- Subtitle -->
      <p class="hero__subtitle">
        {{ 'HERO.SUBTITLE' | translate }}
      </p>


      <!-- =================================================
           RENTAL PLANS
      ================================================== -->
      <fieldset class="hero__plans">

        <legend class="visually-hidden">
          {{ 'HERO.RENTAL_PLAN' | translate }}
        </legend>


        <!-- DAILY -->
        <label
          class="hero__plan"
          [class.hero__plan--active]="selectedPlan() === 'daily'"
        >
          <input
            type="radio"
            name="rentalPlan"
            value="daily"
            [checked]="selectedPlan() === 'daily'"
            (change)="selectPlan('daily')"
          />

          <span
            class="hero__plan-icon"
            aria-hidden="true"
          >
            <i class="fa-regular fa-clock"></i>
          </span>

          <span class="hero__plan-content">

            <span class="hero__plan-label">
              {{ 'HERO.PLANS.DAILY' | translate }}
            </span>

          </span>
        </label>


        <!-- WEEKLY -->
        <label
          class="hero__plan"
          [class.hero__plan--active]="selectedPlan() === 'weekly'"
        >
          <input
            type="radio"
            name="rentalPlan"
            value="weekly"
            [checked]="selectedPlan() === 'weekly'"
            (change)="selectPlan('weekly')"
          />

          <span
            class="hero__plan-icon"
            aria-hidden="true"
          >
            <i class="fa-regular fa-calendar-days"></i>
          </span>

          <span class="hero__plan-content">

            <span class="hero__plan-label">
              {{ 'HERO.PLANS.WEEKLY' | translate }}
            </span>

          </span>
        </label>


        <!-- MONTHLY -->
        <label
          class="hero__plan"
          [class.hero__plan--active]="selectedPlan() === 'monthly'"
        >
          <input
            type="radio"
            name="rentalPlan"
            value="monthly"
            [checked]="selectedPlan() === 'monthly'"
            (change)="selectPlan('monthly')"
          />

          <span
            class="hero__plan-icon"
            aria-hidden="true"
          >
            <i class="fa-regular fa-calendar-check"></i>
          </span>

          <span class="hero__plan-content">

            <span class="hero__plan-label">
              {{ 'HERO.PLANS.MONTHLY' | translate }}
            </span>

          </span>
        </label>

      </fieldset>


      <!-- =================================================
           CTA
      ================================================== -->
      <button
        type="button"
        class="btn btn-primary hero__cta"
        (click)="onExploreCars()"
      >
        <span>
          {{ 'HERO.CTA' | translate }}
        </span>

        <i
          class="fa-solid fa-arrow-right"
          aria-hidden="true"
        ></i>
      </button>

    </div>


    <!-- ===================================================
         SEARCH CARD
    ==================================================== -->
    <form
      class="hero__search glass-card"
      (submit)="onSearchSubmit($event)"
    >

      <!-- =================================================
           CAR TYPE
      ================================================== -->
      <div class="hero__search-field">

        <label for="carType">
          <i
            class="fa-solid fa-car"
            aria-hidden="true"
          ></i>

          {{ 'HERO.SEARCH.CAR_TYPE.LABEL' | translate }}
        </label>

        <select
          id="carType"
          name="carType"
          class="form-control"
        >

          <option value="all">
            {{ 'HERO.SEARCH.CAR_TYPE.ALL_TYPES' | translate }}
          </option>

          @for (category of categories(); track category.id) {

            <option [value]="category.id">
              {{ getCategoryName(category) }}
            </option>

          }

        </select>

      </div>


      <!-- =================================================
           PRICE RANGE
      ================================================== -->
      <div class="hero__search-field">

        <label for="priceRange">
          <i
            class="fa-solid fa-tag"
            aria-hidden="true"
          ></i>

          {{ 'HERO.SEARCH.PRICE_RANGE.LABEL' | translate }}
        </label>

        <select
          id="priceRange"
          name="priceRange"
          class="form-control"
        >

          <option value="all">
            {{ 'HERO.SEARCH.PRICE_RANGE.ANY_PRICE' | translate }}
          </option>

          <option value="500">
            {{ 'HERO.SEARCH.PRICE_RANGE.UP_TO' | translate }} AED 500
          </option>

          <option value="750">
            {{ 'HERO.SEARCH.PRICE_RANGE.UP_TO' | translate }} AED 750
          </option>

          <option value="1000">
            {{ 'HERO.SEARCH.PRICE_RANGE.UP_TO' | translate }} AED 1,000
          </option>

          <option value="1200">
            {{ 'HERO.SEARCH.PRICE_RANGE.UP_TO' | translate }} AED 1,200
          </option>

        </select>

      </div>


      <!-- =================================================
           TRANSMISSION
      ================================================== -->
      <div class="hero__search-field">

        <label for="transmission">
          <i
            class="fa-solid fa-gears"
            aria-hidden="true"
          ></i>

          {{ 'HERO.SEARCH.TRANSMISSION.LABEL' | translate }}
        </label>

        <select
          id="transmission"
          name="transmission"
          class="form-control"
        >

          <option value="All">
            {{ 'HERO.SEARCH.TRANSMISSION.ALL' | translate }}
          </option>

          <option value="Automatic">
            {{ 'HERO.SEARCH.TRANSMISSION.AUTOMATIC' | translate }}
          </option>

          <option value="Manual">
            {{ 'HERO.SEARCH.TRANSMISSION.MANUAL' | translate }}
          </option>

        </select>

      </div>


      <!-- =================================================
           FUEL TYPE
      ================================================== -->
      <div class="hero__search-field">

        <label for="fuelType">
          <i
            class="fa-solid fa-gas-pump"
            aria-hidden="true"
          ></i>

          {{ 'HERO.SEARCH.FUEL_TYPE.LABEL' | translate }}
        </label>

        <select
          id="fuelType"
          name="fuelType"
          class="form-control"
        >

          @for (fuelType of fuelTypes; track fuelType) {

            <option [value]="fuelType">
              {{
                ('HERO.SEARCH.FUEL_TYPE.OPTIONS.' + fuelType.toUpperCase())
                  | translate
              }}
            </option>

          }

        </select>

      </div>


      <!-- =================================================
           SEARCH BUTTON
      ================================================== -->
      <button
        type="submit"
        class="btn btn-primary hero__search-btn"
      >

        <i
          class="fa-solid fa-magnifying-glass"
          aria-hidden="true"
        ></i>

        <span>
          {{ 'HERO.SEARCH.BUTTON' | translate }}
        </span>

      </button>

    </form>

  </div>

</section>
