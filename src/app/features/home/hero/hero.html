<section class="hero">

  <!-- =====================================================
       HERO BACKGROUND
  ====================================================== -->
  <div class="hero__bg" aria-hidden="true">

    <img class="hero__bg-img" src="assets/images/hero/hero.png" alt="" width="1920" height="1080" fetchpriority="high"
      loading="eager" />

    <div class="hero__overlay"></div>

  </div>


  <!-- =====================================================
       HERO CONTAINER
  ====================================================== -->
  <div class="hero__container">

    <!-- ===================================================
         HERO CONTENT
    ==================================================== -->
    <div class="hero__content">

      <span class="hero__eyebrow">
        Premium Car Rental
      </span>

      <h1 class="hero__title">
        Luxury
        <span>on your terms</span>
      </h1>

      <p class="hero__subtitle">
        Premium Cars. Flexible Rentals. Exceptional Experience.
      </p>


      <!-- =================================================
           RENTAL PLANS
      ================================================== -->
      <fieldset class="hero__plans">

        <legend class="visually-hidden">
          Rental plan
        </legend>


        <!-- DAILY -->
        <label class="hero__plan" [class.hero__plan--active]="selectedPlan() === 'daily'">

          <input type="radio" name="rentalPlan" value="daily" [checked]="selectedPlan() === 'daily'"
            (change)="selectPlan('daily')" />

          <span class="hero__plan-icon" aria-hidden="true">
            <i class="fa-regular fa-clock"></i>
          </span>

          <span class="hero__plan-content">
            <span class="hero__plan-label">
              Daily
            </span>
          </span>

        </label>


        <!-- WEEKLY -->
        <label class="hero__plan" [class.hero__plan--active]="selectedPlan() === 'weekly'">

          <input type="radio" name="rentalPlan" value="weekly" [checked]="selectedPlan() === 'weekly'"
            (change)="selectPlan('weekly')" />

          <span class="hero__plan-icon" aria-hidden="true">
            <i class="fa-regular fa-calendar-days"></i>
          </span>

          <span class="hero__plan-content">
            <span class="hero__plan-label">
              Weekly
            </span>
          </span>

        </label>


        <!-- MONTHLY -->
        <label class="hero__plan" [class.hero__plan--active]="selectedPlan() === 'monthly'">

          <input type="radio" name="rentalPlan" value="monthly" [checked]="selectedPlan() === 'monthly'"
            (change)="selectPlan('monthly')" />

          <span class="hero__plan-icon" aria-hidden="true">
            <i class="fa-regular fa-calendar-check"></i>
          </span>

          <span class="hero__plan-content">
            <span class="hero__plan-label">
              Monthly
            </span>
          </span>

        </label>

      </fieldset>


      <!-- =================================================
           CTA
      ================================================== -->
      <button type="button" class="btn btn-primary hero__cta" (click)="onExploreCars()">

        <span>
          Explore Cars
        </span>

        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>

      </button>

    </div>


    <!-- ===================================================
         SEARCH CARD
    ==================================================== -->
    <form class="hero__search glass-card" (submit)="onSearchSubmit($event)">

  
      <!-- =================================================
           CAR TYPE
      ================================================== -->
      <div class="hero__search-field">

        <label for="carType">
          <i class="fa-solid fa-car" aria-hidden="true"></i>

          Car Type
        </label>

        <select id="carType" name="carType" class="form-control">

          <option value="all">
            All Types
          </option>

          @for (category of categories; track category.id) {

          <option [value]="category.id">
            {{ category.nameEn }}
          </option>

          }

        </select>

      </div>


      <!-- =================================================
           PRICE RANGE
      ================================================== -->
      <div class="hero__search-field">

        <label for="priceRange">
          <i class="fa-solid fa-tag" aria-hidden="true"></i>

          Price Range
        </label>

        <select id="priceRange" name="priceRange" class="form-control">

          <option value="all">
            Any Price
          </option>

          <option value="500">
            Up to AED 500
          </option>

          <option value="750">
            Up to AED 750
          </option>

          <option value="1000">
            Up to AED 1,000
          </option>

          <option value="1200">
            Up to AED 1,200
          </option>

        </select>

      </div>


      <!-- =================================================
           TRANSMISSION
      ================================================== -->
      <div class="hero__search-field">

        <label for="transmission">
          <i class="fa-solid fa-gears" aria-hidden="true"></i>

          Transmission
        </label>

        <select id="transmission" name="transmission" class="form-control">

          <option value="All">
            All Transmissions
          </option>

          <option value="Automatic">
            Automatic
          </option>

          <option value="Manual">
            Manual
          </option>

        </select>

      </div>
  <!-- =================================================
           Fuel Type
      ================================================== -->
      <div class="hero__search-field">

        <label for="fuelType">
          <i class="fa-solid fa-gas-pump" aria-hidden="true"></i>

          Fuel Type
        </label>

        <select id="fuelType" name="fuelType" class="form-control">

          @for ( fuelType of fuelTypes; track fuelType) {
          <option (value)="fuelType">
            {{fuelType}}
          </option>
          }

        </select>

      </div>


      <!-- =================================================
           SEARCH BUTTON
      ================================================== -->
      <button type="submit" class="btn btn-primary hero__search-btn">

        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>

        <span>
          Search Cars
        </span>

      </button>

    </form>

  </div>

</section>
