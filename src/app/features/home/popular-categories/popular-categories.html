<section class="popular-categories">

  <div class="popular-categories__container">

    
    <!-- HEADER -->
    <div class="popular-categories__header">

      <div class="popular-categories__heading">

        <span class="popular-categories__eyebrow">
          {{ 'POPULAR_CATEGORIES.HEADER.EYEBROW' | translate }}
        </span>

        <h2 class="popular-categories__title">
          {{ 'POPULAR_CATEGORIES.HEADER.TITLE' | translate }}
        </h2>

      </div>

      <a routerLink="/cars" class="popular-categories__view-all">
        {{ 'POPULAR_CATEGORIES.HEADER.VIEW_ALL' | translate }}
      </a>

    </div>

    <!-- CATEGORIES -->
    <div class="popular-categories__grid">

      @for (cat of categories(); track cat.id) {

      <a class="popular-categories__card" (click)="goToCategory(cat.id)">

        <div class="popular-categories__image">

          <img [src]="cat.imageUrl || 'assets/images/placeholder-car.jpg'" [alt]="getCategoryName(cat)" width="600"
            height="400" loading="lazy" decoding="async" />

        </div>

        <div class="popular-categories__content">

          <h3>
            {{ getCategoryName(cat) }}
          </h3>

          <span>
            {{ getCategoryDescription(cat) }}
          </span>

        </div>

      </a>

      }

    </div>
    

  </div>

</section>
