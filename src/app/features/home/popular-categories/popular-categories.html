<section class="popular-categories">
  <div class="popular-categories__container">

    <!-- HEADER -->
    <div class="popular-categories__header">
      <div class="popular-categories__heading">
        <span class="popular-categories__eyebrow">
          Explore Our Fleet
        </span>

        <h2 class="popular-categories__title">
          Popular Categories
        </h2>
      </div>

      <a
        routerLink="/cars"
        class="popular-categories__view-all"
      >
        View All
      </a>
    </div>

    <!-- CATEGORIES -->
    <div class="popular-categories__grid">

      @for (cat of categories; track cat.id) {
        <a
          (click)="goToCategory(cat.id)"
          class="popular-categories__card"
        >
        <div class="popular-categories__image">
          <img
            src="{{ cat.image }}"
            alt="{{ cat.name }} Cars"
            width="600"
            height="400"
            loading="lazy"
          />
        </div>

        <div class="popular-categories__content">
          <h3>{{ cat.name }}</h3>
          <span>{{ cat.description }}</span>
        </div>
      </a>
      }

    </div>
  </div>
</section>
