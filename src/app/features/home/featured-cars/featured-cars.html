<section class="featured-cars">
  <div class="featured-cars__container">

    <!-- HEADER -->
    <div class="featured-cars__header">
      <h2 class="featured-cars__title">Featured Cars</h2>

      <a routerLink="/cars" class="featured-cars__view-all">
        View All
      </a>
    </div>

    <!-- CARS -->
    <div class="featured-cars__grid">

      @for (car of cars; track car.id) {
      <article class="car-card"
        (click)="goToCarDetails(car.id)">
        <div class="car-card__image">
          <img src="{{ car.image }}" alt="{{ car.name }}" width="600" height="400" loading="lazy" />
        </div>

        <div class="car-card__body">
          <h3 class="car-card__name">
            {{ car.name }}
          </h3>

          <div class="car-card__info">
            <span class="car-card__price">
              {{ car.pricePerDay | currency:'AED':'symbol' }} / Day
            </span>

            <span class="car-card__rating">
              <span class="car-card__star">★</span>
              {{ car.rating }}
            </span>
          </div>
        </div>
      </article>
      }


    </div>
  </div>
</section>
